<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FROSTLINE — Receipts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070707;
    --panel:#141414;
    --panel-2:#1d1d1d;
    --panel-3:#0d0d0d;
    --frost:#f7f7f7;
    --frost-dim:#c7c7c7;
    --ice:#ffffff;
    --ice-dim:#8a8a8a;
    --steel:#828282;
    --line:rgba(255,255,255,0.14);
    --warm:#e2e2e2;
    --warm-dim:#5a5a5a;
    --violet:#e2e2e2;
    --violet-dim:#5a5a5a;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,255,255,0.05), transparent 55%),
      var(--bg);
    color:var(--frost);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--ice);color:var(--bg);}

  /* ---------- frostline jagged divider (signature motif) ---------- */
  .frostline{
    height:10px;
    width:100%;
    background:
      linear-gradient(135deg, var(--ice) 25%, transparent 25%) 0 0/10px 10px,
      linear-gradient(225deg, var(--ice) 25%, transparent 25%) 0 0/10px 10px;
    background-color:transparent;
    opacity:0.55;
    mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
  }
  .frostline.dim{opacity:0.18;}

  /* ---------- header ---------- */
  header{
    padding:28px clamp(16px,4vw,56px) 0;
    max-width:1400px;
    margin:0 auto;
  }
  .brandrow{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    padding-bottom:22px;
  }
  .logo-img{
    height:96px;
    width:auto;
    display:block;
  }
  .tagline{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--steel);
    margin-top:6px;
  }
  .headerlinks{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--steel);
    text-align:right;
    line-height:1.6;
    letter-spacing:0.02em;
  }
  .headerlinks span{color:var(--ice);}

  main{
    max-width:1400px;
    margin:0 auto;
    padding:26px clamp(16px,4vw,56px) 70px;
    display:grid;
    grid-template-columns:minmax(320px,420px) 1fr;
    gap:26px;
  }
  @media (max-width:920px){
    main{grid-template-columns:1fr;}
  }

  /* ---------- panel shell ---------- */
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-3));
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:'';
    position:absolute; inset:0 0 auto 0; height:1px;
    background:linear-gradient(90deg, transparent, var(--ice), transparent);
    opacity:0.5;
  }
  .panel-head{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .panel-head h2{
    font-family:'Antonio',sans-serif;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    margin:0;
    color:var(--frost);
  }
  .panel-head .idx{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ice-dim);
  }

  /* ---------- form ---------- */
  form{padding:20px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--steel);
    margin-bottom:7px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--frost);
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder, textarea::placeholder{color:#6b6b6b;}
  input:focus, select:focus, textarea:focus{
    border-color:var(--ice);
    box-shadow:0 0 0 3px rgba(255,255,255,0.12);
  }
  select{appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%23ffffff' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  textarea{resize:vertical; min-height:60px; font-family:'Inter',sans-serif;}
  .amt input{font-family:'JetBrains Mono',monospace;}

  .typeToggle{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .typeToggle button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--frost-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:10px 6px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:all .15s ease;
  }
  .typeToggle button.active{
    background:rgba(255,255,255,0.1);
    border-color:var(--ice);
    color:var(--ice);
  }

  .genbtn{
    width:100%;
    background:var(--ice);
    color:#062028;
    border:none;
    font-family:'Antonio',sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.03em;
    padding:13px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    margin-top:6px;
    transition:filter .15s ease, transform .1s ease;
  }
  .genbtn:hover{filter:brightness(1.08);}
  .genbtn:active{transform:scale(0.995);}

  .secbtn{
    width:100%;
    background:transparent;
    color:var(--steel);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:10px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    margin-top:10px;
  }
  .secbtn:hover{border-color:var(--ice); color:var(--ice);}

  /* ---------- right column ---------- */
  .rightcol{display:flex; flex-direction:column; gap:22px;}

  /* ---------- downpayment item editor (form) ---------- */
  .dpitem-row{
    display:grid;
    grid-template-columns:1fr 70px 60px 24px;
    gap:6px;
    align-items:center;
    margin-bottom:8px;
  }
  .dpitem-row input{
    padding:8px 9px;
    font-size:12.5px;
  }
  .dpitem-row input.dpi-price, .dpitem-row input.dpi-qty{
    font-family:'JetBrains Mono',monospace;
    text-align:right;
  }
  .dpitem-remove{
    background:transparent;
    border:1px solid var(--line);
    color:var(--steel);
    border-radius:8px;
    width:24px; height:24px;
    line-height:1;
    cursor:pointer;
    font-size:14px;
  }
  .dpitem-remove:hover{border-color:var(--frost); color:var(--frost);}
  .dpitem-addbtn{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--frost-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:9px;
    width:100%;
    border-radius:var(--radius-sm);
    cursor:pointer;
    margin-bottom:14px;
  }
  .dpitem-addbtn:hover{border-color:var(--frost); color:var(--frost);}
  .dp-fee-toggle{
    display:flex; align-items:center; gap:8px;
    margin-bottom:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--frost-dim);
    cursor:pointer;
    user-select:none;
  }
  .dp-fee-toggle input[type=checkbox]{
    width:16px; height:16px;
    accent-color:var(--frost);
    cursor:pointer;
  }
  .dp-pct-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .dp-pct-row input{width:70px; text-align:right; font-family:'JetBrains Mono',monospace;}
  .dp-pct-row span{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--steel);}

  /* ---------- proof of transaction upload ---------- */
  .proof-upload{
    display:flex; align-items:center; justify-content:center;
    min-height:64px;
    border:1px dashed var(--line);
    border-radius:var(--radius-sm);
    color:var(--frost-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    text-align:center;
    padding:14px 12px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .proof-upload:hover{border-color:var(--frost); color:var(--frost);}
  #proofPreviewWrap{margin-top:10px;}
  #proofPreviewImg{
    max-width:100%;
    max-height:160px;
    display:block;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
  }
  .proof-filename-form{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--frost-dim);
    word-break:break-all;
    margin-top:6px;
  }

  /* ---------- itemized downpayment lines (traditional receipt style) ---------- */
  .dp-lines{margin-bottom:2px;}
  .dp-item-line{
    display:flex; justify-content:space-between; gap:10px;
    padding:9px 0;
    border-bottom:1px dashed rgba(12,28,40,0.18);
    font-size:13px;
  }
  .dp-item-line .lbl{font-weight:500;}
  .dp-item-line .val{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:#4a6072;
    white-space:nowrap;
  }
  .dp-due-note{
    font-size:10.5px;
    font-style:italic;
    color:#6b6b6b;
    text-align:right;
    margin-top:-2px;
    padding-bottom:6px;
  }

  /* ---------- email section ---------- */
  .email-row{
    display:flex; gap:8px; padding:0 22px 22px; align-items:stretch;
  }
  .email-row input{
    flex:1;
    height:42px;
    box-sizing:border-box;
    margin:0;
  }
  .email-row button{
    flex:none;
    white-space:nowrap;
    height:42px;
    box-sizing:border-box;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* receipt preview */

  #receiptOuter{padding:22px;}
  .receipt{
    background:var(--frost);
    color:#0c1c28;
    border-radius:var(--radius) var(--radius) 0 0;
    max-width:480px;
    margin:0 auto;
    position:relative;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  .receipt-top{
    padding:26px 26px 18px;
  }
  .receipt-brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .receipt-logo-img{
    height:46px;
    width:auto;
    display:block;
  }
  .receipt-type{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:#0c1c28;
    color:var(--frost);
    padding:5px 9px;
  }
  .receipt-meta{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:#6b6b6b;
  }
  .receipt-meta b{color:#0c1c28; font-weight:600;}

  .frostline-mini{
    height:8px; width:100%;
    background:
      linear-gradient(135deg, #0c1c28 25%, transparent 25%) 0 0/8px 8px,
      linear-gradient(225deg, #0c1c28 25%, transparent 25%) 0 0/8px 8px;
    opacity:0.15;
  }

  .receipt-body{padding:20px 26px 6px;}
  .rline{
    display:flex; justify-content:space-between; gap:10px;
    padding:9px 0;
    border-bottom:1px dashed rgba(12,28,40,0.18);
    font-size:13px;
  }
  .rline .lbl{color:#6b6b6b; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; padding-top:2px;}
  .rline .val{text-align:right; max-width:60%; font-weight:500;}

  .receipt-amounts{padding:14px 26px 4px;}
  .aline{display:flex; justify-content:space-between; padding:6px 0; font-family:'JetBrains Mono',monospace; font-size:13px;}
  .aline.total{font-size:15px; font-weight:600; border-top:1px solid #0c1c28; margin-top:6px; padding-top:12px;}
  .aline.due .val{color:#0c1c28; font-weight:700; border-bottom:2px solid #0c1c28; padding-bottom:2px;}
  .aline .val{font-weight:600;}

  .receipt-notes{
    padding:8px 26px 20px;
    font-size:12px;
    color:#6b6b6b;
    font-style:italic;
    line-height:1.5;
  }

  .receipt-proof{
    padding:4px 26px 20px;
  }
  .receipt-proof-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#6b6b6b;
    margin-bottom:8px;
  }
  .receipt-proof img{
    max-width:100%;
    max-height:280px;
    display:block;
    border:1px solid #d8d8d8;
    border-radius:4px;
  }
  .proof-filename{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:#4a6072;
    word-break:break-all;
  }

  .receipt-foot{
    padding:16px 26px 26px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:#6b6b6b;
  }

  /* jagged bottom edge — frostline motif instead of standard scallop */
  .receipt-edge{
    height:14px;
    background:
      linear-gradient(135deg, var(--panel-3) 50%, transparent 50%) 0 0,
      linear-gradient(225deg, var(--panel-3) 50%, transparent 50%) 0 0;
    background-size:16px 28px;
    background-position:top;
    background-color:var(--frost);
    border-radius:0 0 var(--radius) var(--radius);
  }

  .actions{
    display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;
  }
  .actions button{
    flex:1; min-width:140px;
  }

  footer{
    max-width:1400px; margin:0 auto; padding:0 clamp(16px,4vw,56px) 40px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--steel);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }

  /* ---------- print ---------- */
  @media print{
    body *{visibility:hidden;}
    #receiptOuter, #receiptOuter *{visibility:visible;}
    #receiptOuter{position:absolute; left:0; top:0; width:100%; padding:0; background:white;}
    .receipt{box-shadow:none; max-width:100%;}
    .actions{display:none;}
  }
</style>
</head>

<main>
  <!-- FORM -->
  <div class="panel">
    <div class="panel-head">
      <h2>New Entry</h2>
      <span class="idx" id="nextNo">FL-000001</span>
    </div>
    <form id="rform">

      <div class="typeToggle" id="docToggle">
        <button type="button" data-doc="receipt" class="active">Receipt</button>
        <button type="button" data-doc="invoice">Invoice</button>
      </div>

      <div class="typeToggle" id="typeToggle">
        <button type="button" data-type="downpayment" class="active">Downpayment</button>
        <button type="button" data-type="full">Full Payment</button>
      </div>

      <div class="row2">
        <div class="field">
          <label id="lblName">Customer</label>
          <input type="text" id="fName" placeholder="e.g. Marisol Cruz">
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="fDate">
        </div>
      </div>

      <div id="dpItemsSection">
        <label style="display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel); margin-bottom:7px;">Order Items</label>
        <div id="dpItemsList"></div>
        <button type="button" class="dpitem-addbtn" id="dpAddItem">+ Add item</button>
        <label class="dp-fee-toggle">
          <input type="checkbox" id="fMockupFee">
          <span>Apply Design/Template/Mockup Fee (₱560)</span>
        </label>
        <div class="dp-pct-row" id="dpPctRow">
          <label style="font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel);">DP %</label>
          <input type="number" id="fDpPct" value="50" min="0" max="100" step="1">
          <span id="dpSummary">Grand total ₱0.00 — DP ₱0.00</span>
        </div>
      </div>

      <div class="field">
        <label>Payment Method</label>
        <select id="fMethod">
          <option>Cash</option>
          <option>Bank Transfer</option>
          <option>GCash</option>
          <option>Cheque</option>
          <option>Card</option>
        </select>
      </div>

      <div class="field">
        <label>Proof of Transaction</label>
        <label class="proof-upload" id="proofUploadLabel" for="fProof">
          <span id="proofUploadText">Click to attach a screenshot / photo of payment</span>
        </label>
        <input type="file" id="fProof" accept="image/*,.pdf" style="display:none;">
        <div id="proofPreviewWrap" style="display:none;">
          <img id="proofPreviewImg" style="display:none;">
          <div id="proofFileName" class="proof-filename-form"></div>
          <button type="button" class="secbtn" id="proofRemove" style="margin-top:8px;">Remove attachment</button>
        </div>
      </div>

      <div id="extraFieldsForm">
        <div class="field">
          <label id="lblIssuer">Received By</label>
          <input type="text" id="fIssuer" placeholder="Staff name">
        </div>

        <div class="field">
          <label>Notes</label>
          <textarea id="fNotes" placeholder="Optional — terms, next due date, reference no."></textarea>
        </div>
      </div>

      <button type="submit" class="genbtn">Generate Receipt</button>
      <button type="button" class="secbtn" id="clearForm">Clear Fields</button>
    </form>
  </div>

  <!-- RIGHT SIDE -->
  <div class="rightcol">

    <div class="panel" id="receiptOuter">

<script>
(function(){
  const $ = id => document.getElementById(id);
  const CUR = '₱';
  const fmt = n => CUR + (Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});

  let currentType = 'downpayment';
  let docCategory = 'receipt';
  let counter = 1;
  let dpNextId = 3;
  let dpItems = [
    { id: 1, name: '', price: 0, qty: 0 },
    { id: 2, name: '', price: 0, qty: 0 }
  ];

  const MOCKUP_FEE = 560;

  function computeDpTotals(){
    const isFull = currentType === 'full';
    const pct = isFull ? 100 : (parseFloat($('fDpPct').value) || 0);
    const items = dpItems.map(it => ({ name: (it.name||'').trim(), price: it.price||0, qty: it.qty||0 }));
    const totalQty = items.reduce((s,it)=> s + it.qty, 0);
    const itemsTotal = items.reduce((s,it)=> s + it.price*it.qty, 0);
    const feeApplies = $('fMockupFee').checked;
    const fee = feeApplies ? MOCKUP_FEE : 0;
    const grandTotal = itemsTotal + fee;
    const dpAmount = isFull ? grandTotal : grandTotal * (pct/100);
    return { items, itemsTotal, totalQty, feeApplies, fee, grandTotal, dpAmount, dpPct: pct, isFull };
  }

  function renderDpItemsForm(){
    $('dpItemsList').innerHTML = dpItems.map(it => `
      <div class="dpitem-row">
        <input type="text" class="dpi-name" data-field="name" data-id="${it.id}" placeholder="Item name (e.g. Singlet)" value="${(it.name||'').replace(/"/g,'&quot;')}">
        <input type="number" class="dpi-price" data-field="price" data-id="${it.id}" placeholder="Per pc" step="0.01" min="0" value="${it.price || ''}">
        <input type="number" class="dpi-qty" data-field="qty" data-id="${it.id}" placeholder="Qty" step="1" min="0" value="${it.qty || ''}">
        <button type="button" class="dpitem-remove" data-remove="${it.id}" title="Remove item">&times;</button>
      </div>`).join('');
  }

  function renderDpTablePreview(){
    const { items, itemsTotal, feeApplies, fee, grandTotal, dpAmount, dpPct, totalQty, isFull } = computeDpTotals();
    const activeItems = items.filter(it => it.name || it.price || it.qty);
    const list = activeItems.length ? activeItems : items;
    const balance = Math.max(grandTotal - dpAmount, 0);

    const itemLines = list.map(it => {
      const label = it.name || 'Item';
      const lineTotal = (it.price||0) * (it.qty||0);
      return `<div class="dp-item-line"><span class="lbl">${label}</span><span class="val">${it.qty||0} &times; ${fmt(it.price||0)} = ${fmt(lineTotal)}</span></div>`;
    }).join('');

    const feeLine = feeApplies
      ? `<div class="dp-item-line"><span class="lbl">Design/Template/Mockup Fee</span><span class="val">${fmt(fee)}</span></div>`
      : '';

    let paidLineLabel;
    if(isFull){
      paidLineLabel = docCategory === 'invoice' ? 'Amount to be Paid (Full)' : 'Amount Received (Paid in Full)';
    } else {
      paidLineLabel = docCategory === 'invoice' ? `Amount to be Paid (${dpPct}%)` : `Downpayment Received (${dpPct}%)`;
    }

    const balanceBlock = isFull
      ? ''
      : `<div class="aline due"><span>Balance — Unpaid</span><span class="val">${fmt(balance)}</span></div>
         <div class="dp-due-note">Payable upon completion, before release of customized item(s).</div>`;

    $('dpTablePreview').innerHTML = `
      <div class="dp-lines">${itemLines}${feeLine}</div>
      <div class="aline"><span>Grand total</span><span class="val">${fmt(grandTotal)}</span></div>
      <div class="aline total"><span>${paidLineLabel}</span><span class="val">${fmt(dpAmount)}</span></div>
      ${balanceBlock}`;

    const summary = $('dpSummary');
    if(summary) summary.textContent = `Grand total ${fmt(grandTotal)} — DP ${fmt(dpAmount)}`;
  }

  const typeLabels = {
    downpayment: { name:'Customer', issuer:'Received By', issuerLbl:'Received by', sig:'Authorized signature' },
    full:        { name:'Customer', issuer:'Received By', issuerLbl:'Received by', sig:'Authorized signature' }
  };

  const docStrings = {
    downpayment: { receipt: 'DOWNPAYMENT RECEIPT', invoice: 'DOWNPAYMENT INVOICE' },
    full:        { receipt: 'PAYMENT RECEIPT — PAID IN FULL', invoice: 'INVOICE — FULL PAYMENT' }
  };

  function pad(n){ return String(n).padStart(6,'0'); }
  function refreshNextNo(){
    $('nextNo').textContent = 'FL-' + pad(counter);
  }

  function setDoc(doc){
    docCategory = doc;
    document.querySelectorAll('#docToggle button').forEach(b=>{
      b.classList.toggle('active', b.dataset.doc === doc);
    });
    updatePreview();
  }

  function setType(type){
    currentType = type;
    document.querySelectorAll('#typeToggle button').forEach(b=>{
      b.classList.toggle('active', b.dataset.type === type);
    });
    const t = typeLabels[type];
    $('lblName').textContent = t.name;
    $('lblIssuer').textContent = t.issuer;
    const showExtras = type !== 'downpayment';
    $('extraFieldsForm').style.display = showExtras ? '' : 'none';
    $('extraRowsReceipt').style.display = showExtras ? '' : 'none';

    $('dpPctRow').style.display = type === 'downpayment' ? '' : 'none';

    refreshNextNo();
    updatePreview();
  }

  
  function updatePreview(){
    const t = typeLabels[currentType];
    const docLabel = docStrings[currentType][docCategory];
    const name = $('fName').value.trim() || '—';
    const method = $('fMethod').value;
    const issuer = $('fIssuer').value.trim() || '—';
    const notes = $('fNotes').value.trim();
    const dateVal = $('fDate').value;

    $('rType').textContent = docLabel;
    $('hdrType').textContent = docLabel.split(' — ')[0];
    $('rNo').textContent = 'FL-' + pad(counter);
    $('rDate').textContent = dateVal ? new Date(dateVal+'T00:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '—';
    $('rNameLbl').textContent = t.name;
    $('rName').textContent = name;
    $('rMethod').textContent = method;
    $('rIssuerLbl').textContent = t.issuerLbl;
    $('rIssuer').textContent = issuer;
    $('rNotesWrap').style.display = notes ? '' : 'none';
    $('rNotes').textContent = notes;

    renderDpTablePreview();
  }

  document.querySelectorAll('#docToggle button').forEach(b=>{
    b.addEventListener('click', ()=> setDoc(b.dataset.doc));
  });

  document.querySelectorAll('#typeToggle button').forEach(b=>{
    b.addEventListener('click', ()=> setType(b.dataset.type));
  });

  ['fName','fMethod','fIssuer','fNotes','fDate'].forEach(id=>{
    $(id).addEventListener('input', updatePreview);
    $(id).addEventListener('change', updatePreview);
  });

  $('fDpPct').addEventListener('input', updatePreview);
  $('fMockupFee').addEventListener('change', updatePreview);

  $('dpItemsList').addEventListener('input', function(e){
    const t = e.target;
    if(!t.dataset || !t.dataset.field) return;
    const id = Number(t.dataset.id);
    const item = dpItems.find(i => i.id === id);
    if(!item) return;
    if(t.dataset.field === 'name') item.name = t.value;
    else item[t.dataset.field] = parseFloat(t.value) || 0;
    updatePreview();
  });

  $('dpItemsList').addEventListener('click', function(e){
    const removeId = e.target.dataset ? e.target.dataset.remove : null;
    if(!removeId) return;
    const id = Number(removeId);
    dpItems = dpItems.filter(i => i.id !== id);
    if(dpItems.length === 0) dpItems.push({ id: dpNextId++, name:'', price:0, qty:0 });
    renderDpItemsForm();
    updatePreview();
  });

  $('dpAddItem').addEventListener('click', function(){
    dpItems.push({ id: dpNextId++, name:'', price:0, qty:0 });
    renderDpItemsForm();
    updatePreview();
  });

  function buildReceiptText(){
    const lines = [];
    lines.push('FROSTLINE — ' + $('rType').textContent);
    lines.push('Receipt No: ' + $('rNo').textContent);
    lines.push('Date: ' + $('rDate').textContent);
    lines.push($('rNameLbl').textContent + ': ' + $('rName').textContent);
    lines.push('Method: ' + $('rMethod').textContent);
    lines.push('');
    const { items, feeApplies, fee, grandTotal, dpAmount, dpPct, isFull } = computeDpTotals();
    items.forEach(it=>{
      if(!it.name && !it.price && !it.qty) return;
      lines.push(`${it.name || 'Item'} — ${it.qty} pc(s) x ${fmt(it.price)} = ${fmt(it.price*it.qty)}`);
    });
    if(feeApplies){
      lines.push('Design/Template/Mockup Fee: ' + fmt(fee));
    }
    lines.push('');
    lines.push('Grand Total: ' + fmt(grandTotal));
    let paidLineLabel;
    if(isFull){
      paidLineLabel = docCategory === 'invoice' ? 'Amount to be Paid (Full)' : 'Amount Received (Paid in Full)';
    } else {
      paidLineLabel = docCategory === 'invoice' ? `Amount to be Paid (${dpPct}%)` : `Downpayment Received (${dpPct}%)`;
    }
    lines.push(`${paidLineLabel}: ` + fmt(dpAmount));
    if(!isFull){
      lines.push('Balance — Unpaid: ' + fmt(Math.max(grandTotal - dpAmount, 0)) + ' (payable upon completion, before release of customized item(s))');
    }
    const notes = $('rNotes').textContent;
    if(notes){ lines.push(''); lines.push('Notes: ' + notes); }
    return lines.join('\n');
  }

  $('emailBtn').addEventListener('click', function(){
    const email = $('fEmail').value.trim();
    if(!email){ $('fEmail').focus(); return; }
    const subject = encodeURIComponent('Frostline Receipt ' + $('rNo').textContent);
    const body = encodeURIComponent(buildReceiptText());
    window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
  });

  $('rform').addEventListener('submit', function(e){
    e.preventDefault();
    updatePreview();
  });

  $('clearForm').addEventListener('click', function(){
    ['fName','fIssuer','fNotes'].forEach(id=> $(id).value = '');
    $('fDate').value = todayStr();
    $('fDpPct').value = 50;
    $('fMockupFee').checked = false;
    $('fProof').value = '';
    proofData = null;
    renderProofPreview();
    dpItems = [
      { id: dpNextId++, name:'', price:0, qty:0 },
      { id: dpNextId++, name:'', price:0, qty:0 }
    ];
    renderDpItemsForm();
    updatePreview();
  });

  $('printBtn').addEventListener('click', function(){ window.print(); });

  $('saveJpgBtn').addEventListener('click', function(){
    const btn = this;
    const originalText = btn.textContent;
    if(typeof html2canvas === 'undefined'){
      alert('JPG export library failed to load. Check your internet connection and try again.');
      return;
    }
    btn.textContent = 'Rendering…';
    btn.disabled = true;
    const node = $('receiptCard');
    html2canvas(node, { backgroundColor: '#ffffff', scale: 2, useCORS: true }).then(function(canvas){
      const link = document.createElement('a');
      link.download = 'frostline-' + $('rNo').textContent.toLowerCase() + '.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
      btn.textContent = originalText;
      btn.disabled = false;
    }).catch(function(err){
      console.error('JPG export failed:', err);
      alert('Could not generate the JPG. Please try again.');
      btn.textContent = originalText;
      btn.disabled = false;
    });
  });

  let proofData = null; // { dataUrl, isImage, name }

  function renderProofPreview(){
    const wrap = $('proofPreviewWrap');
    const label = $('proofUploadText');
    if(!proofData){
      wrap.style.display = 'none';
      label.textContent = 'Click to attach a screenshot / photo of payment';
      $('rProofWrap').style.display = 'none';
      return;
    }
    wrap.style.display = '';
    label.textContent = 'Attached — click to replace';
    if(proofData.isImage){
      $('proofPreviewImg').src = proofData.dataUrl;
      $('proofPreviewImg').style.display = '';
      $('proofFileName').textContent = '';
    } else {
      $('proofPreviewImg').style.display = 'none';
      $('proofFileName').textContent = proofData.name;
    }
    $('rProofWrap').style.display = '';
    if(proofData.isImage){
      $('rProofImg').src = proofData.dataUrl;
      $('rProofImg').style.display = '';
      $('rProofFileName').textContent = '';
    } else {
      $('rProofImg').style.display = 'none';
      $('rProofFileName').textContent = proofData.name;
    }
  }

  $('fProof').addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const isImage = file.type.startsWith('image/');
    const reader = new FileReader();
    reader.onload = function(ev){
      proofData = { dataUrl: ev.target.result, isImage, name: file.name };
      renderProofPreview();
    };
    reader.readAsDataURL(file);
  });

  $('proofRemove').addEventListener('click', function(e){
    e.preventDefault();
    proofData = null;
    $('fProof').value = '';
    renderProofPreview();
  });

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function tickClock(){
    const d = new Date();
    $('clockLine').textContent = d.toLocaleString('en-PH', { dateStyle:'medium', timeStyle:'short' });
  }
  tickClock();
  setInterval(tickClock, 30000);

  $('fDate').value = todayStr();
  renderDpItemsForm();
  setType('downpayment');
})();
</script>

</body>
</html>
